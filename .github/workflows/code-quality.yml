name: Extension quality and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine-tests:
    name: Local engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/local-engine/tests/requirements.txt
      - run: python -m pip install -r apps/local-engine/tests/requirements.txt
      - run: python -m unittest discover -s apps/local-engine/tests
  extension:
    needs: engine-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build:extension
      - run: node --test apps/extension/tests/*.test.mjs
      - run: python scripts/package_extension.py
      - uses: actions/upload-artifact@v4
        with:
          name: polyglot-extension-1.7.0
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
